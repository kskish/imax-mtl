name: Scrape IMAX showtimes

on:
  schedule:
    - cron: "15 * * * *" # ~9am ET
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run scraper
        run: node scripts/scrape.mjs

      - name: Build website showtimes JSON
        run: node build-showtimes.js

      - name: Commit and push changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/*.json showtimes.json

          echo "Checking for showtime changes..."

          if git diff --staged --quiet; then
            echo "No showtime changes to commit."
          else
            echo "Showtime changes detected. Committing..."
            git commit -m "Update IMAX showtimes"
            git push
          fi
