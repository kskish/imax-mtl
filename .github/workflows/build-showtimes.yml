name: Build IMAX showtimes

on:
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * *"

permissions:
  contents: write

jobs:
  build-showtimes:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create IMAX-only JSON
        run: node build-showtimes.js

      - name: Commit updated showtimes file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add showtimes.json
          git diff --staged --quiet || git commit -m "Update IMAX showtimes"
          git push