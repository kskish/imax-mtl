name: Scrape IMAX showtimes

on:
  schedule:
    # Fixed UTC times while Montreal is on EDT (UTC-4).
    # Use :07 instead of :00 to reduce the chance of GitHub scheduler delays.
    - cron: "7 13 * * *" # About 9:07 AM Montreal during EDT
    - cron: "7 16 * * *" # About 12:07 PM Montreal during EDT
    - cron: "7 19 * * *" # About 3:07 PM Montreal during EDT
    - cron: "7 22 * * *" # About 6:07 PM Montreal during EDT
    - cron: "7 1 * * *" # About 9:07 PM Montreal during EDT
    - cron: "7 4 * * *" # About 12:07 AM Montreal during EDT
    - cron: "35 22 * * *" # 6:35 PM Montreal during EDT

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run scraper
        run: node scripts/scrape.mjs

      - name: Build website showtimes JSON
        run: node build-showtimes.js

      - name: Commit and push changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/*.json showtimes.json

          if git diff --staged --quiet; then
            echo "No showtime changes to commit."
          else
            git commit -m "Update IMAX showtimes"
            git push
          fi
