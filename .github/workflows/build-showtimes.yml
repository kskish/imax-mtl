name: Scrape IMAX showtimes

on:
  schedule:
    # Times below are UTC-4 (EDT); each drifts back ~1hr during EST (UTC-5).
    - cron: "0 13 * * *" # ~9am ET
    - cron: "0 16 * * *" # ~12pm ET
    - cron: "0 19 * * *" # ~3pm ET
    - cron: "0 22 * * *" # ~6pm ET
    - cron: "0 1 * * *" # ~9pm ET (previous calendar day in ET)
    - cron: "0 4 * * *" # ~12am ET
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run scraper
        run: node scripts/scrape.mjs

      - name: Build website showtimes JSON
        run: node build-showtimes.js

      - name: Commit and push changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/*.json showtimes.json

          if git diff --staged --quiet; then
            echo "No showtime changes to commit."
          else
            git commit -m "Update IMAX showtimes"
            git push
          fi
