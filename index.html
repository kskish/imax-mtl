<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IMAX Showtimes</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page-shell">
    <header class="page-header">
      <h1>IMAX Showtimes</h1>

      <div
        id="theatre-tabs"
        class="theatre-tabs"
        aria-label="Choose a theatre"
      ></div>

      <p id="theatre-name" class="theatre-name">
        Loading theatre...
      </p>

      <p id="updated-at" class="updated-at"></p>
    </header>

    <div id="app" aria-live="polite"></div>
  </main>

  <script>
    const theatres = [
      {
        name: "Cinéma Cineplex Forum et VIP",
        file: "data/forum-montreal.json"
      },
      {
        name: "Cinéma Banque Scotia Montréal",
        file: "data/scotiabank-montreal.json"
      }
    ];

    const dateFormatter = new Intl.DateTimeFormat(undefined, {
      weekday: "short",
      month: "short",
      day: "numeric"
    });

    const timeFormatter = new Intl.DateTimeFormat(undefined, {
      hour: "numeric",
      minute: "2-digit"
    });

    const tabs = document.getElementById("theatre-tabs");
    const app = document.getElementById("app");
    const theatreName = document.getElementById("theatre-name");
    const updatedAt = document.getElementById("updated-at");

    function formatDate(dateString) {
      return dateFormatter.format(
        new Date(`${dateString}T12:00:00`)
      );
    }

    function formatTime(timeString) {
      const [hours, minutes] = timeString.split(":");

      const date = new Date();
      date.setHours(Number(hours), Number(minutes), 0, 0);

      return timeFormatter.format(date);
    }

    function createElement(tagName, className, text = "") {
      const element = document.createElement(tagName);

      if (className) {
        element.className = className;
      }

      if (text) {
        element.textContent = text;
      }

      return element;
    }

    function renderMovie(movie) {
      const movieCard = createElement("article", "movie-card");

      if (movie.poster) {
        const poster = document.createElement("img");
        poster.className = "poster";
        poster.src = movie.poster;
        poster.alt = `${movie.title} poster`;
        poster.loading = "lazy";
        movieCard.appendChild(poster);
      }

      const movieDetails = createElement("div", "movie-details");

      movieDetails.appendChild(
        createElement("h3", "movie-title", movie.title)
      );

      const metadata = [
        movie.format,
        movie.runtimeMinutes
          ? `${movie.runtimeMinutes} min`
          : ""
      ]
        .filter(Boolean)
        .join(" · ");

      if (metadata) {
        movieDetails.appendChild(
          createElement("p", "movie-meta", metadata)
        );
      }

      const showtimes = createElement("div", "showtimes");

      const sortedSessions = [...(movie.sessions || [])]
        .sort((a, b) => a.time.localeCompare(b.time));

      sortedSessions.forEach(session => {
        const link = document.createElement("a");

        link.className = "showtime";
        link.href = session.ticketUrl || "#";
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = formatTime(session.time);
        link.title =
          `Buy tickets for ${movie.title} at ${formatTime(session.time)}`;

        if (!session.ticketUrl) {
          link.removeAttribute("target");
          link.removeAttribute("rel");
          link.setAttribute("aria-disabled", "true");
        }

        showtimes.appendChild(link);
      });

      movieDetails.appendChild(showtimes);
      movieCard.appendChild(movieDetails);

      return movieCard;
    }

    function renderTheatre(data) {
      const theatre = data.theatre;

      if (!theatre) {
        throw new Error(
          "The JSON file does not contain a theatre object"
        );
      }

      theatreName.textContent = theatre.name;

      updatedAt.textContent = data.updatedAt
        ? `Last updated: ${new Date(
            data.updatedAt
          ).toLocaleString()}`
        : "";

      app.replaceChildren();

      if (!data.days || data.days.length === 0) {
        app.appendChild(
          createElement(
            "p",
            "empty-state",
            "No IMAX showtimes found."
          )
        );

        return;
      }

      data.days.forEach(day => {
        const daySection = createElement(
          "section",
          "day-section"
        );

        daySection.appendChild(
          createElement(
            "h2",
            "day-heading",
            formatDate(day.date)
          )
        );

        const movieList = createElement(
          "div",
          "movie-list"
        );

        (day.movies || []).forEach(movie => {
          movieList.appendChild(renderMovie(movie));
        });

        daySection.appendChild(movieList);
        app.appendChild(daySection);
      });
    }

    async function loadTheatre(theatre) {
      app.replaceChildren(
        createElement(
          "p",
          "empty-state",
          "Loading showtimes..."
        )
      );

      theatreName.textContent = "Loading theatre...";
      updatedAt.textContent = "";

      const response = await fetch(
        `${theatre.file}?cacheBust=${Date.now()}`
      );

      if (!response.ok) {
        throw new Error(
          `Could not load ${theatre.file}: ${response.status}`
        );
      }

      const data = await response.json();
      renderTheatre(data);
    }

    function setActiveButton(selectedButton) {
      document.querySelectorAll(".theatre-tab").forEach(button => {
        button.classList.remove("active");
        button.setAttribute("aria-pressed", "false");
      });

      selectedButton.classList.add("active");
      selectedButton.setAttribute("aria-pressed", "true");
    }

    function createTheatreTabs() {
      theatres.forEach((theatre, index) => {
        const button = document.createElement("button");

        button.type = "button";
        button.className = "theatre-tab";
        button.textContent = theatre.name;
        button.setAttribute("aria-pressed", "false");

        button.addEventListener("click", async () => {
          setActiveButton(button);

          try {
            await loadTheatre(theatre);
          } catch (error) {
            console.error(error);

            theatreName.textContent = theatre.name;
            updatedAt.textContent = "";

            app.replaceChildren(
              createElement(
                "p",
                "empty-state",
                `Could not load ${theatre.file}. Check the file path and JSON format.`
              )
            );
          }
        });

        tabs.appendChild(button);

        if (index === 0) {
          setActiveButton(button);

          loadTheatre(theatre).catch(error => {
            console.error(error);

            theatreName.textContent = theatre.name;
            app.replaceChildren(
              createElement(
                "p",
                "empty-state",
                `Could not load ${theatre.file}. Check the browser console.`
              )
            );
          });
        }
      });
    }

    createTheatreTabs();
  </script>
</body>
</html>
